<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>241A010633 - Bài tập 36</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #222;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    header h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 10px;
    }
    .box {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #ddd;
      text-align: center;
    }
    .box h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }
    .game-info {
      width: 500px;
      margin: 0 auto 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
    }
    #start-btn {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    #game-container {
      width: 500px;
      height: 400px;
      background-color: #eef2f5;
      border: 2px solid #bbb;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }
    #basket {
      position: absolute;
      bottom: 10px;
      left: 210px;
      width: 80px;
      height: 25px;
      background-color: #8b4513;
      border-radius: 4px;
    }
    #apple {
      position: absolute;
      top: 0;
      left: 238px;
      width: 24px;
      height: 24px;
      background-color: #dc3545;
      border-radius: 50%;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nguyễn Hoàng Anh - MSSV: 241A010633</h1>
    <p>Bài tập 36 - Mini Game Web (Hứng Táo)</p>
  </header>

  <main>
    <section class="box">
      <h2>Khung Trò Chơi Hứng Táo</h2>
      <div class="game-info">
        <span>Điểm: <b id="score">0</b></span>
        <span>Mạng: <b id="lives">3</b></span>
        <button id="start-btn">Bắt đầu</button>
      </div>
      <div id="game-container">
        <div id="basket"></div>
        <div id="apple"></div>
        <div id="game-over">Game Over</div>
      </div>
    </section>
  </main>

  <script>
    const basket = document.getElementById('basket');
    const apple = document.getElementById('apple');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startBtn = document.getElementById('start-btn');
    const gameOverEl = document.getElementById('game-over');

    let score = 0;
    let lives = 3;
    let speed = 3;
    let basketX = 210;
    let appleX = 238;
    let appleY = 0;
    let running = false;
    let gameLoopId = null;
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        keys[e.key] = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function resetApple() {
      appleY = 0;
      appleX = Math.floor(Math.random() * (500 - 24));
      apple.style.top = appleY + 'px';
      apple.style.left = appleX + 'px';
    }

    function update() {
      if (!running) return;

      if (keys['ArrowLeft'] && basketX > 0) {
        basketX = Math.max(0, basketX - 7);
      }
      if (keys['ArrowRight'] && basketX < 500 - 80) {
        basketX = Math.min(500 - 80, basketX + 7);
      }
      basket.style.left = basketX + 'px';

      appleY += speed;
      apple.style.top = appleY + 'px';

      const basketTop = basket.offsetTop;
      if (
        appleY + 24 >= basketTop &&
        appleY <= basketTop + 25 &&
        appleX + 24 >= basketX &&
        appleX <= basketX + 80
      ) {
        score++;
        scoreEl.textContent = score;
        speed += 0.3;
        resetApple();
      } else if (appleY + 24 >= 400) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          running = false;
          cancelAnimationFrame(gameLoopId);
          gameOverEl.style.display = 'flex';
          return;
        }
        resetApple();
      }

      gameLoopId = requestAnimationFrame(update);
    }

    startBtn.addEventListener('click', () => {
      if (gameLoopId) cancelAnimationFrame(gameLoopId);
      score = 0;
      lives = 3;
      speed = 3;
      basketX = 210;
      basket.style.left = basketX + 'px';
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      gameOverEl.style.display = 'none';
      resetApple();
      running = true;
      gameLoopId = requestAnimationFrame(update);
    });
  </script>
</body>
</html>
